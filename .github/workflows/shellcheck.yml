# Při každém pushi a pull requestu zkontroluje všechny .sh soubory ShellCheckem.
name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spustit ShellCheck
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning
